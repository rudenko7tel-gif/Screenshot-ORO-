plugins { id 'com.android.application' }
android {
    namespace 'oro.screenshot'
    compileSdk 34
    defaultConfig {
        applicationId 'oro.screenshot'
        minSdk 28
        targetSdk 30
        versionCode 3
        versionName '0.0003'
    }
    def ks = System.getenv('SIGNING_KEYSTORE')
    signingConfigs {
        oro {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias 'screenshotoro'
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }
    buildTypes { debug { if (ks) signingConfig signingConfigs.oro } }
    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
